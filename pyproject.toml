[project]
name = "paper-trade-agent"
version = "0.1.0"
description = "A股模拟投资交易系统 - 多Agent协作"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "apscheduler>=3.10.0",
    "cachetools>=5.5.0",
    "aiolimiter>=1.2.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "chinese-calendar>=1.11.0",
    "akshare>=1.18.84",
    "fastembed>=0.8.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.ruff.lint]
# 以下规则为本项目的刻意设计决策，予以豁免：
# - BLE001/S110/S112: LLM 应用常见的防御性兜底异常（降级、静默恢复）
# - DTZ005/DTZ007/DTZ011: A股系统统一按中国时区（东八区）本地时间运行
# - ASYNC230: 启动初始化/独立采集脚本中的一次性文件读取，非热路径
ignore = [
    "BLE001",   # blind-except — 兜底异常是 agent 降级机制
    "S110",     # try-except-pass — 幂等迁移/清理的静默恢复
    "S112",     # try-except-continue — 采集循环单条失败跳过
    "DTZ005",   # datetime.now() 无时区 — A股系统按东八区本地时间运行
    "DTZ007",   # strptime 无 %z — 解析本地时间字符串
    "DTZ011",   # date.today() 无时区 — 同上
    "ASYNC230", # async 中 open() — 仅初始化/脚本场景
]

[tool.ruff.lint.per-file-ignores]
"backend/harness/*.py" = ["F401"]  # harness 公共 API 模块：导入即转发

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv.sources]
